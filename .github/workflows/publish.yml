name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Test
        run: npm test

      - name: Test compatibility contract
        run: npm run test:compatibility

      - name: Test installed package
        run: npm run test:package

      - name: Verify package exports and types
        run: npm run check:package

      - name: Check release state
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$REF_NAME" != "v${package_version}" ]; then
            echo "::error::Tag ${REF_NAME} does not match package version ${package_version}."
            exit 1
          fi
          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "package_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "package_published=false" >> "$GITHUB_OUTPUT"
          fi
          if gh release view "$REF_NAME" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.release_state.outputs.package_published != 'true'
        run: npm publish --provenance --access public

      - name: Create GitHub release
        if: steps.release_state.outputs.release_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: gh release create "$REF_NAME" --verify-tag --generate-notes --title "$REF_NAME"
